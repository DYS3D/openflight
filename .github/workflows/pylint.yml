name: Pylint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Analysing the code with pylint
        run: uv run pylint src/openflight/ --fail-under=9

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ruff lint
        run: uv run ruff check src/openflight
      - name: Ruff format check
        # These files predate the format gate and are not ruff-formatted yet.
        # Drop each entry once it is reformatted; new files must be formatted.
        run: >-
          uv run ruff format --check src/openflight
          --exclude src/openflight/ballistics.py,src/openflight/camera/club_delivery.py,src/openflight/gspro/codec.py,src/openflight/iwr6843/trajectory.py,src/openflight/ops243.py,src/openflight/sim/transport.py
