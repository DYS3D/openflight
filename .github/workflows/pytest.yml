name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run tests
        # Line coverage was 81% when this gate was added. Raise the floor as
        # coverage improves; do not lower it to get a change through.
        run: uv run pytest tests/ -v --tb=short --cov=openflight --cov-report=term --cov-fail-under=80
