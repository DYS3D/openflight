<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenFlight Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%277%27 fill=%27%23c98f4e%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/sessions">OPENFLIGHT</a>
  <nav class="tabs" aria-label="Pages">
    <a href="#/sessions" data-page="sessions">Sessions</a>
    <a href="#/trends" data-page="trends">Trends</a>
    <a href="#/gapping" data-page="gapping">Gapping</a>
    <a href="#/records" data-page="records">Records</a>
  </nav>
  <div class="top__tools">
    <label class="field">
      <span class="field__label">Golfer</span>
      <select id="profile"><option value="">Everyone</option></select>
    </label>
    <div class="sync">
      <span id="sync-status" class="sync__status"></span>
      <button id="sync-now" type="button" class="button">Sync now</button>
    </div>
  </div>
</header>
<main id="page" class="page" aria-live="polite"></main>
<div id="tooltip" class="tooltip" role="status" hidden></div>
</body>
</html>
