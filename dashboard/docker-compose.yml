services:
  openflight-dashboard:
    build: .
    container_name: openflight-dashboard
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      # Your Pi's IP address. Names like openflight.local often do not resolve
      # inside Docker, so use the number.
      OPENFLIGHT_PI_URL: "http://192.168.1.50:8080"
      OPENFLIGHT_SYNC_MINUTES: "5"
    volumes:
      - ./data:/data
