[project]
name = "openflight-dashboard"
version = "0.1.0"
description = "Home dashboard for OpenFlight session logs (runs on a PC or NAS)"
requires-python = ">=3.11"
dependencies = ["flask>=3.0"]

[project.scripts]
openflight-dashboard = "openflight_dashboard.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openflight_dashboard"]

[tool.ruff]
line-length = 100
